services:

  mongo:
    image: mongo:latest
    container_name: home-sense-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 60s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-spring/
      dockerfile: Dockerfile
    container_name: home-sense-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/climate-data
      ARDUINO_API_KEY: ${ARDUINO_API_KEY}
      ARDUINO_FRONTEND_API_KEY: ${FRONTEND_API_KEY}

  frontend:
    build:
      context: ./frontend-react/
      dockerfile: Dockerfile
    container_name: home-sense-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo-data: